name: fetch-prices

# KAMIS 가격을 하루 2번 받아 GitHub Pages(gh-pages 브랜치)에 prices.json / history.json 으로 올립니다.
# 앱은 https://<아이디>.github.io/<저장소>/prices.json 과 history.json 을 읽습니다.
on:
  schedule:
    - cron: '0 7 * * *'   # 16:00 KST (KAMIS 당일 조사가 반영된 뒤)
    - cron: '0 23 * * *'  # 08:00 KST (아침 보정)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 어제까지 쌓인 이력을 gh-pages 에서 가져와 이어 붙입니다.
      - name: Restore previous history (all regions)
        run: |
          mkdir -p out
          if git fetch origin gh-pages --depth=1 2>/dev/null; then
            git archive origin/gh-pages | tar -x -C out
            ls out
          else
            echo "gh-pages 브랜치 없음 (첫 실행)"
          fi

      - name: Fetch KAMIS prices
        env:
          KAMIS_CERT_KEY: ${{ secrets.KAMIS_CERT_KEY }}
          KAMIS_CERT_ID: ${{ secrets.KAMIS_CERT_ID }}
        run: node scripts/fetch-prices.mjs out

      - name: Build today's push text
        run: node scripts/build-push.mjs out

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
