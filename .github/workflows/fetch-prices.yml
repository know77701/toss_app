name: fetch-prices

# 공공데이터포털 가격을 하루 2번 받아 GitHub Pages(gh-pages 브랜치)에 prices.json / history.json 으로 올립니다.
# 앱은 https://<아이디>.github.io/<저장소>/prices.json 과 history.json 을 읽습니다.
on:
  schedule:
    - cron: '0 7 * * *'   # 16:00 KST (KAMIS 당일 조사가 반영된 뒤)
    - cron: '0 23 * * *'  # 08:00 KST (아침 보정)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch KAMIS prices
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          FOODSAFETY_KEY: ${{ secrets.FOODSAFETY_KEY }}
        run: node scripts/fetch-prices.mjs out

      - name: Build today's push text
        run: node scripts/build-push.mjs out

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
